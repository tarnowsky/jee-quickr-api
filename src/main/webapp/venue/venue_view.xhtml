<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/template/main.xhtml">

    <f:metadata>
        <f:viewParam name="id" value="#{venueView.id}" required="true"/>
        <f:viewAction action="#{venueView.init()}"/>
    </f:metadata>

    <ui:define name="content">
        <h:outputStylesheet library="venue" name="css/venue_view.css"/>
        <article>
            <header>
                <h2>
                    <h:outputText value="#{venueView.venue.name}"/>
                </h2>
            </header>
            <hr/>
            <div class="item-info-container">
                <p>ID:</p>
                <h:outputText value="#{venueView.venue.id}"/>
            </div>
            <div class="item-info-container">
                <p>#{msg['venue.view.label.venue_category']}:</p>
                <h:outputText value="#{venueView.venue.venueCategory}"/>
            </div>
            <h6>#{msg['venue.view.header.venue_orders']}:</h6>
            <h:dataTable value="#{venueView.venue.orders}" var="order" styleClass="table">
                <h:column>
                    <f:facet name="header">ID</f:facet>
                    <h:outputText value="#{order.id}"/>
                </h:column>
                <h:column>
                    <f:facet name="header">#{msg['order.price']}</f:facet>
                    <h:outputText value="#{order.price}"/> PLN
                </h:column>
                <h:column>
                    <f:facet name="header">#{msg['order.view']}</f:facet>
                    <h:link outcome="/order/order_view.xhtml" value="#{msg['order.view']}">
                        <f:param name="id" value="#{order.id}"/>
                    </h:link>
                </h:column>
                <h:column>
                    <f:facet name="header">#{msg['order.delete']}</f:facet>
                    <h:form>
                        <h:commandButton styleClass="btn" value="#{msg['order.delete']}" action="#{venueView.deleteAction(order)}"/>
                    </h:form>
                </h:column>
            </h:dataTable>
            <p>
                <h:link outcome="/order/order_create.xhtml" value="#{msg['order.create']}">
                    <f:param name="id" value="#{venueView.id}"/>
                </h:link>
            </p>
        </article>
    </ui:define>
</ui:composition>
