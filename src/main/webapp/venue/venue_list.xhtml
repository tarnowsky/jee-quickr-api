<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/template/main.xhtml">

    <ui:define name="content">
        <h:outputStylesheet library="venue" name="css/venue_list.css"/>
        <article>
            <header>
                <h2>Venues</h2>
            </header>
            <h:dataTable value="#{venueList.venues.venues}" var="venue" styleClass="table">
                <h:column>
                    <f:facet name="header">ID</f:facet>
                    <h:outputText value="#{venue.id}"/>
                </h:column>
                <h:column>
                    <f:facet name="header">Name</f:facet>
                    <h:outputText value="#{venue.name}"/>
                </h:column>
                <h:column>
                    <f:facet name="header">Venue Category</f:facet>
                    <h:outputText value="#{venue.venueCategory}"/>
                </h:column>
                <h:column>
                    <f:facet name="header">View</f:facet>
                    <h:link outcome="/venue/venue_view.xhtml" value="View">
                        <f:param name="id" value="#{venue.id}" />
                    </h:link>
                </h:column>
                <h:column>
                    <f:facet name="header">Delete</f:facet>
                    <h:form>
                        <h:commandButton styleClass="btn" value="Delete" action="#{venueList.deleteAction(venue)}"/>
                    </h:form>
                </h:column>
            </h:dataTable>
        </article>

    </ui:define>
</ui:composition>
