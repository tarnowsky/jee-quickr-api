<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/template/main.xhtml">

    <f:metadata>
        <f:viewParam name="venueId" value="#{userVenueOrders.venueId}" required="true"/>
        <f:viewAction action="#{userVenueOrders.init()}"/>
    </f:metadata>

    <ui:define name="content">
        <article>
            <header>
                <h2>#{msg['venue.orders.title']}</h2>
            </header>
            <h:panelGroup id="order-table-container">
                <h:dataTable value="#{userVenueOrders.orders.orders}" var="order" styleClass="table">
                    <h:column>
                        <f:facet name="header">ID</f:facet>
                        <h:outputText value="#{order.id}"/>
                    </h:column>
                    <h:column>
                        <f:facet name="header">#{msg['order.price']}</f:facet>
                        <h:outputText value="#{order.price}"/> PLN
                    </h:column>
                    <h:column>
                        <f:facet name="header">#{msg['order.view']}</f:facet>
                        <h:link outcome="/order/order_view.xhtml" value="#{msg['order.view']}">
                            <f:param name="id" value="#{order.id}"/>
                        </h:link>
                    </h:column>
                    <h:column>
                        <f:facet name="header">#{msg['order.edit']}</f:facet>
                        <h:link outcome="/order/order_edit.xhtml" value="#{msg['order.edit']}">
                            <f:param name="id" value="#{order.id}"/>
                        </h:link>
                    </h:column>
                    <h:column>
                        <f:facet name="header">#{msg['order.delete']}</f:facet>
                        <h:form>
                            <h:commandButton styleClass="btn" value="#{msg['order.delete']}"
                                             action="#{userVenueOrders.deleteAction(order)}">
                                <f:ajax execute="@form" render=":order-table-container"/>
                            </h:commandButton>
                        </h:form>
                    </h:column>
                </h:dataTable>
            </h:panelGroup>
            <p>
                <h:link outcome="/order/order_create.xhtml" value="#{msg['order.create']}">
                    <f:param name="id" value="#{userVenueOrders.venueId}"/>
                </h:link>
            </p>
            <p>
                <h:link outcome="/venue/venue_list.xhtml" value="#{msg['venue.back']}"/>
            </p>
        </article>
    </ui:define>

</ui:composition>
