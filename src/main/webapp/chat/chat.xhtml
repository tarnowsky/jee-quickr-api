<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/template/main.xhtml">

    <ui:define name="content">
        <div class="row">
            <div class="col-md-12">
                <h2>Chat</h2>
                
                <div id="chatWindow" style="height: 300px; overflow-y: scroll; border: 1px solid #ccc; padding: 10px; margin-bottom: 10px;">
                    <!-- Messages will appear here -->
                </div>

                <h:form id="chatForm">
                    <div class="mb-3">
                        <h:outputLabel for="recipient" value="Recipient (or 'All'):" styleClass="form-label"/>
                        <h:inputText id="recipient" value="#{chatController.recipient}" styleClass="form-control"/>
                    </div>
                    
                    <div class="mb-3">
                        <h:outputLabel for="message" value="Message:" styleClass="form-label"/>
                        <h:inputText id="message" value="#{chatController.messageContent}" styleClass="form-control" autocomplete="off"/>
                    </div>

                    <h:commandButton value="Send" action="#{chatController.sendMessage}" styleClass="btn btn-primary">
                        <f:ajax execute="@form" render="message"/>
                    </h:commandButton>
                </h:form>
            </div>
        </div>

        <script type="text/javascript">
            var wsUrl = "ws://" + document.location.host + "#{request.contextPath}/chat";
            var websocket = new WebSocket(wsUrl);
            var chatWindow = document.getElementById("chatWindow");
            var currentUser = "#{chatController.currentUser}";

            websocket.onopen = function(event) {
                appendMessage("System", "Connected to chat.");
            };

            websocket.onmessage = function(event) {
                var msg = JSON.parse(event.data);
                var sender = msg.sender ? msg.sender : "Unknown";
                var content = msg.content;
                var timestamp = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString() : "";
                
                appendMessage(sender, content + " (" + timestamp + ")");
            };

            websocket.onerror = function(event) {
                appendMessage("Error", "WebSocket error.");
            };
            
            websocket.onclose = function(event) {
                appendMessage("System", "Disconnected.");
            };

            function appendMessage(sender, message) {
                var div = document.createElement("div");
                div.innerHTML = "<strong>" + sender + ":</strong> " + message;
                chatWindow.appendChild(div);
                chatWindow.scrollTop = chatWindow.scrollHeight;
            }
        </script>
    </ui:define>

</ui:composition>
