<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/template/main.xhtml">

    <f:metadata>
        <f:viewParam name="id" value="#{orderView.id}" required="true"/>
        <f:viewAction action="#{orderView.init()}"/>
    </f:metadata>

    <ui:define name="content">
        <h:outputStylesheet library="order" name="css/order_view.css"/>
        <article>
            <header>
                <h2>#{msg['order.view.title']}</h2>
            </header>
            <div class="item-info-container">
                <p>ID:</p>
                <h:outputText value="#{orderView.id}"/>
            </div>
            <div class="item-info-container">
                <p>#{msg['order.view.label.price']}:</p>
                <h:outputText value="#{orderView.order.price}"/>
                PLN
            </div>
            <div class="item-info-container">
                <p>#{msg['order.view.label.venue_name']}:</p>
                <h:outputText value="#{orderView.order.venueName}"/>
            </div>
            <div class="item-info-container">
                <p>#{msg['order.view.label.user_login']}:</p>
                <h:outputText value="#{orderView.order.userLogin}"/>
            </div>
            <div class="item-info-container">
                <p>#{msg['order.view.label.order_date']}:</p>
                <h:outputText value="#{orderView.order.orderDate}"/>
            </div>
            <p>
                <h:link outcome="/order/order_edit.xhtml" value="#{msg['order.view.button.edit']}">
                    <f:param name="id" value="#{orderView.id}"/>
                </h:link>
            </p>



        </article>
    </ui:define>

</ui:composition>
