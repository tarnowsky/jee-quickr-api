<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/template/main.xhtml">
    <f:metadata>
        <f:viewParam name="id" value="#{orderCreate.venueId}" required="true"/>
        <f:viewAction action="#{orderCreate.init()}"/>
    </f:metadata>
    <ui:define name="content">
        <h:outputStylesheet library="order" name="css/order_create.css"/>

        <article>
            <header><h2>Create Order</h2></header>
            <h:form styleClass="edit-form" onreset="onReset()" enctype="multipart/form-data">
                <div class="form-outline">
                    <h:inputText id="price" value="#{orderCreate.order.price}" styleClass="form-control"/>
                    <h:outputLabel for="price" value="Price:" styleClass="form-label"/>
                </div>
                <div class="form-outline">
                    <h:inputText styleClass="form-control" id="date" value="#{orderCreate.order.orderDate}">
                        <f:convertDateTime pattern="yyyy-MM-dd" type="localDate"/>
                    </h:inputText>
                    <h:outputLabel for="date" value="Order date:" styleClass="form-label"/>
                </div>
                <div class="btn-container-multi">
                    <div class="text-center">
                        <h:commandButton styleClass="btn btn-primary" value="Create"
                                         action="#{orderCreate.saveAction()}"/>
                    </div>
                    <div class="text-center">
                        <h:commandButton styleClass="btn btn-secondary" value="Cancel"
                                         action="#{orderCreate.cancelAction()}"/>
                    </div>
                </div>

            </h:form>


        </article>
    </ui:define>
</ui:composition>
