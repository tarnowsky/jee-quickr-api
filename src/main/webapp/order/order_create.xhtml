<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/template/main.xhtml">
    <f:metadata>
        <f:viewParam name="id" value="#{orderCreate.venueId}" required="true"/>
        <f:viewAction action="#{orderCreate.init()}"/>
    </f:metadata>
    <ui:define name="content">
        <h:outputStylesheet library="order" name="css/order_create.css"/>

        <article>
            <header><h2>#{msg['order.create.title']}</h2></header>
            <h:form styleClass="edit-form" onreset="onReset()" enctype="multipart/form-data">
                <div class="form-outline">
                    <h:inputText id="price" value="#{orderCreate.order.price}" styleClass="form-control"/>
                    <h:outputLabel for="price" value="#{msg['order.create.label.price']}" styleClass="form-label"/>
                </div>
                <div class="form-outline">
                    <h:inputText styleClass="form-control" id="date" value="#{orderCreate.order.orderDate}">
                        <f:convertDateTime pattern="yyyy-MM-dd" type="localDate"/>
                    </h:inputText>
                    <h:outputLabel for="date" value="#{msg['order.create.label.order_date']}" styleClass="form-label"/>
                </div>
                <!-- Admin-only: Select which user the order belongs to -->
                <h:panelGroup rendered="#{facesContext.externalContext.isUserInRole('admin')}">
                    <div>
                        <h:outputLabel for="userId" value="#{msg['order.create.label.user']}" styleClass="form-label"/>
                        <h:selectOneMenu id="userId" value="#{orderCreate.order.userId}" styleClass="form-select">
                            <f:selectItems value="#{orderCreate.availableUsers}" var="user"
                                           itemValue="#{user.id}" itemLabel="#{user.login}"/>
                        </h:selectOneMenu>
                    </div>
                </h:panelGroup>
                <!-- Regular user: Show their login as readonly -->
                <h:panelGroup rendered="#{!facesContext.externalContext.isUserInRole('admin')}">
                    <div class="form-outline">
                        <h:inputText id="userLogin" value="#{facesContext.externalContext.userPrincipal.name}" 
                                     readonly="true" styleClass="form-control"/>
                        <h:outputLabel for="userLogin" value="#{msg['order.create.label.user']}" styleClass="form-label"/>
                    </div>
                </h:panelGroup>
                <div class="btn-container-multi">
                    <div class="text-center">
                        <h:commandButton styleClass="btn btn-primary" value="#{msg['order.create.button.create']}"
                                         action="#{orderCreate.saveAction()}"/>
                    </div>
                    <div class="text-center">
                        <h:commandButton styleClass="btn btn-secondary" value="#{msg['order.create.button.cancel']}"
                                         action="#{orderCreate.cancelAction()}"/>
                    </div>
                </div>

            </h:form>


        </article>
    </ui:define>
</ui:composition>
