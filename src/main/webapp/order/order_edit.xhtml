<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/template/main.xhtml">

    <f:metadata>
        <f:viewParam name="id" value="#{orderEdit.id}" required="true"/>
        <f:viewAction action="#{orderEdit.init()}"/>
    </f:metadata>

    <ui:define name="content">
        <h:outputStylesheet library="order" name="css/order_edit.css"/>

        <article>
            <header>
                <h2>#{msg['order.edit.title']}
                    <h:outputText value="#{orderEdit.id}"/>
                </h2>
            </header>
            <h:form styleClass="edit-form" enctype="multipart/form-data" onreset="onReset()">
                <div class="form-outline">
                    <h:inputText id="name" value="#{orderEdit.order.name}" styleClass="form-control"/>
                    <h:outputLabel for="name" value="#{msg['order.name']}" styleClass="form-label"/>
                </div>
                <div class="form-outline">
                    <h:inputText id="itemCount" value="#{orderEdit.order.itemCount}" styleClass="form-control"/>
                    <h:outputLabel for="itemCount" value="#{msg['order.item_count']}" styleClass="form-label"/>
                </div>
                <div class="form-outline">
                    <h:inputText id="price" value="#{orderEdit.order.price}" styleClass="form-control"/>
                    <h:outputLabel for="price" value="#{msg['order.edit.label.price']}" styleClass="form-label"/>
                </div>
                <div class="form-outline">
                    <h:inputText styleClass="form-control" id="date" value="#{orderEdit.order.orderDate}">
                        <f:convertDateTime pattern="yyyy-MM-dd" type="localDate"/>
                    </h:inputText>
                    <h:outputLabel for="date" value="#{msg['order.edit.label.order_date']}" styleClass="form-label"/>
                </div>
                <h:inputHidden value="#{orderEdit.order.version}"/>
                
                <div class="btn-container-multi">
                    <div>
                        <h:commandButton styleClass="btn btn-primary" value="#{msg['order.edit.button.update']}" action="#{orderEdit.saveAction()}"/>
                    </div>
                    <div>
                        <h:commandButton styleClass="btn btn-secondary" type="reset" value="#{msg['order.edit.button.reset']}"/>
                    </div>
                    <div>
                        <h:button styleClass="btn btn-secondary" value="#{msg['order.edit.button.back']}" outcome="/venue/user_venue_orders.xhtml">
                            <f:param name="venueId" value="#{orderEdit.venueId}"/>
                        </h:button>
                    </div>
                </div>
                
            </h:form>
            <h:panelGroup rendered="#{orderEdit.dbOrder != null}" styleClass="collision-info">
                <h3>#{msg['venue.edit.collision.title']}</h3>
                <p>#{msg['venue.edit.collision.message']}</p>
                <h:panelGrid columns="2" styleClass="comparison-grid">
                    <h:outputText value="#{msg['order.edit.label.price']}"/>
                    <h:outputText value="#{orderEdit.dbOrder.price}"/>

                    <h:outputText value="#{msg['order.edit.label.order_date']}"/>
                    <h:outputText value="#{orderEdit.dbOrder.orderDate}"/>
                </h:panelGrid>
                <h:form>
                    <h:commandButton styleClass="btn btn-warning" value="#{msg['order.edit.button.reload']}" action="#{orderEdit.reloadData()}"/>
                </h:form>
            </h:panelGroup>
        </article>
    </ui:define>

</ui:composition>
